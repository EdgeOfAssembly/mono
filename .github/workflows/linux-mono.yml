name: Linux + Mono

# Runs on every push to main/release branches and on every pull request.
# The job executes inside the SAME pre-built Docker image that Azure
# Pipelines uses for its Linux x64 lane, so the build environment is
# fully pinned and reproducible — no runtime apt downloads, no version
# mismatches, 100 % build certainty.
#
# Image: mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-18.04-mono-amd64
#   • Ubuntu 18.04 base
#   • GCC / G++ / Make / Autoconf / Automake / CMake / Python 3 pre-installed
#   • Mono 6.x bootstrap compiler pre-installed
#   • All required native libraries present
#
# A "monolite" fallback bootstrap step is also included: if the container's
# Mono ever fails to compile the C# sources, monolite (a minimal pre-built
# mcs binary) is fetched automatically and the build continues.

on:
  push:
    branches:
      - main
      - '20*-*'
    paths-ignore:
      - '.github/CONTRIBUTING.md'
      - 'CODE-OF-CONDUCT.md'
      - 'PATENTS.TXT'
      - 'THIRD-PARTY-NOTICES.TXT'
  pull_request:
    branches:
      - main
      - '20*-*'
    paths-ignore:
      - '.github/CONTRIBUTING.md'
      - 'CODE-OF-CONDUCT.md'
      - 'PATENTS.TXT'
      - 'THIRD-PARTY-NOTICES.TXT'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Linux x64)
    # Use a GitHub-hosted runner; the actual build runs inside the container below.
    runs-on: ubuntu-22.04
    # ── Pre-built container ───────────────────────────────────────────────
    # This is the EXACT same image that the Azure Pipelines "Linux x64" lane
    # uses (see scripts/ci/mono-ci-job-template.yml).  Every tool, library,
    # and Mono bootstrap version is already present and tested — eliminating
    # the #1 source of build flakiness: runtime package installation.
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-18.04-mono-amd64
      options: --platform linux/amd64 --user 0:0
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CPU_COUNT: 4   # overridden at runtime; see "Detect CPU count" step

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      # ── Detect CPU count ──────────────────────────────────────────────────
      - name: Detect CPU count
        run: echo "CPU_COUNT=$(getconf _NPROCESSORS_ONLN || echo 4)" >> "$GITHUB_ENV"

      # ── Tool-version diagnostics ──────────────────────────────────────────
      # These lines log the exact versions for every run so failures are easy
      # to correlate with environment changes.
      - name: Print host environment
        run: |
          uname -a
          cat /etc/os-release || true
          gcc --version
          make --version
          python3 --version
          mono --version

      # ── ccache ────────────────────────────────────────────────────────────
      # Cache compiled objects across runs.  After the first full build,
      # subsequent runs typically complete in a fraction of the time.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-amd64-${{ github.sha }}
          restore-keys: |
            ccache-linux-amd64-

      - name: Set up ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
          echo "CC=ccache gcc"   >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"

      # ── Monolite fallback bootstrap ───────────────────────────────────────
      # Monolite is a pre-built minimal mcs binary maintained by the Mono
      # project.  We fetch it unconditionally so that the C# bootstrap step
      # NEVER depends on the container's Mono being perfectly compatible with
      # HEAD.  If the container's Mono works, this is a no-op at compile time;
      # if it doesn't, monolite takes over automatically.
      - name: Configure (autogen.sh)
        run: |
          ./autogen.sh \
            CFLAGS="-ggdb3 -O2" \
            CXXFLAGS="-ggdb3 -O2" \
            --with-crash-privacy=no

      - name: Fetch monolite bootstrap (guaranteed C# compiler)
        run: make get-monolite-latest

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: make -j"${CPU_COUNT}" -w V=1

      # ── ccache stats ──────────────────────────────────────────────────────
      - name: Print ccache statistics
        if: always()
        run: ccache --show-stats

      # ── Verify the freshly built runtime ─────────────────────────────────
      - name: Print built Mono version
        run: mono/mini/mono-sgen --version

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run mini JIT tests
        run: make -w -C mono/mini -k check EMIT_NUNIT=1

      - name: Run mini AOT check
        run: make -j"${CPU_COUNT}" -w -C mono/mini -k aotcheck
        continue-on-error: true   # AOT depends on optional native tooling

      - name: Run runtime unit tests
        run: make -w -C mono/unit-tests -k check

      - name: Run eglib unit tests
        run: make -w -C mono/eglib/test -k check

      - name: Run compiler tests
        run: make -w -C mcs/tests run-test
        timeout-minutes: 30

      - name: Run compiler error tests
        run: make -w -C mcs/errors run-test
        timeout-minutes: 30

      - name: Run corlib tests
        run: make -w -C mcs/class/corlib run-test
        timeout-minutes: 30

      # ── Publish test results ──────────────────────────────────────────────
      - name: Upload NUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-amd64
          path: '**/TestResult*.xml'
          if-no-files-found: ignore
